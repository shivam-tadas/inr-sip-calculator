<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calculate your one-time lumpsum mutual fund investment returns in real-time with an interactive, modern INR Lumpsum Calculator.">
  <title>Lumpsum Calculator — Real-Time Investment Growth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <main class="calculator-wrapper">
    <div class="glass-card" id="lumpsumCalculator">
      <!-- Header with Brand -->
      <header class="card-header">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 3h12M6 8h12M6 13l8.5 8M6 13h3a4.5 4.5 0 0 0 0-9H6"/>
            </svg>
          </div>
          <div>
            <h1 class="brand-title">Lumpsum Calculator</h1>
          </div>
        </div>

        <div class="currency-badge">
          <span class="badge-dot"></span>
          <span>INR (₹)</span>
        </div>
      </header>

      <!-- Top Result Display (Hero Section) -->
      <section class="result-hero" id="resultHero" aria-live="polite">
        <span class="result-label">Expected Maturity Amount</span>
        <div class="hero-amount-wrapper">
          <span class="hero-currency" id="displayCurrencySymbol">₹</span>
          <span class="hero-amount" id="totalMaturityValue">3,10,585</span>
        </div>

        <!-- Key Metrics Cards -->
        <div class="metrics-grid">
          <div class="metric-card invested">
            <div class="metric-indicator"></div>
            <div class="metric-content">
              <span class="metric-title">Invested Amount</span>
              <span class="metric-value" id="totalInvestedValue">₹1,00,000</span>
            </div>
          </div>
          <div class="metric-card returns">
            <div class="metric-indicator"></div>
            <div class="metric-content">
              <span class="metric-title">Est. Wealth Gain</span>
              <span class="metric-value" id="totalReturnsValue">₹2,10,585</span>
            </div>
          </div>
        </div>

        <!-- Visual Proportional Progress Bar -->
        <div class="ratio-bar-container">
          <div class="ratio-bar">
            <div class="ratio-invested" id="ratioInvestedBar" style="width: 32.20%;"></div>
            <div class="ratio-returns" id="ratioReturnsBar" style="width: 67.80%;"></div>
          </div>
          <div class="ratio-legend">
            <span class="legend-item"><span class="dot dot-invested"></span> Invested: <strong id="investedPercent">32.2%</strong></span>
            <span class="legend-item"><span class="dot dot-returns"></span> Gains: <strong id="returnsPercent">67.8%</strong></span>
          </div>
        </div>
      </section>

      <!-- Input Controls Section -->
      <section class="inputs-section">
        <!-- Input 1: Total Lumpsum Investment -->
        <div class="input-group" id="groupInvestment">
          <div class="input-header">
            <label for="totalInvestmentInput" class="input-label">
              <span class="label-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
              </span>
              Total Investment
            </label>
            <div class="input-box-wrapper">
              <span class="input-affix" id="investmentAffix">₹</span>
              <input 
                type="number" 
                id="totalInvestmentInput" 
                class="text-input" 
                value="100000" 
                min="1000" 
                max="10000000" 
                step="1000" 
                aria-label="Total Lumpsum Investment Amount"
              >
            </div>
          </div>
          <div class="slider-wrapper">
            <input 
              type="range" 
              id="totalInvestmentSlider" 
              class="range-slider" 
              value="100000" 
              min="1000" 
              max="10000000" 
              step="1000"
              aria-label="Total Lumpsum Investment Slider"
            >
          </div>
          <div class="presets-row">
            <button type="button" class="preset-chip" data-target="investment" data-value="25000">25k</button>
            <button type="button" class="preset-chip" data-target="investment" data-value="50000">50k</button>
            <button type="button" class="preset-chip active" data-target="investment" data-value="100000">1 Lakh</button>
            <button type="button" class="preset-chip" data-target="investment" data-value="500000">5 Lakh</button>
            <button type="button" class="preset-chip" data-target="investment" data-value="1000000">10 Lakh</button>
            <button type="button" class="preset-chip" data-target="investment" data-value="2500000">25 Lakh</button>
          </div>
        </div>

        <!-- Input 2: Expected Return Rate -->
        <div class="input-group" id="groupRate">
          <div class="input-header">
            <label for="returnRateInput" class="input-label">
              <span class="label-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
              </span>
              Expected Return Rate (p.a.)
            </label>
            <div class="input-box-wrapper">
              <input 
                type="number" 
                id="returnRateInput" 
                class="text-input text-right" 
                value="12" 
                min="1" 
                max="30" 
                step="0.1" 
                aria-label="Expected Annual Return Rate"
              >
              <span class="input-affix suffix">%</span>
            </div>
          </div>
          <div class="slider-wrapper">
            <input 
              type="range" 
              id="returnRateSlider" 
              class="range-slider" 
              value="12" 
              min="1" 
              max="30" 
              step="0.1"
              aria-label="Return Rate Slider"
            >
          </div>
          <div class="presets-row">
            <button type="button" class="preset-chip" data-target="rate" data-value="8">8% (Cons.)</button>
            <button type="button" class="preset-chip active" data-target="rate" data-value="12">12% (Index)</button>
            <button type="button" class="preset-chip" data-target="rate" data-value="15">15% (Equity)</button>
            <button type="button" class="preset-chip" data-target="rate" data-value="18">18% (Agg.)</button>
          </div>
        </div>

        <!-- Input 3: Duration / Time Period -->
        <div class="input-group" id="groupDuration">
          <div class="input-header">
            <label for="durationInput" class="input-label">
              <span class="label-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              </span>
              Investment Duration
            </label>
            <div class="input-box-wrapper">
              <input 
                type="number" 
                id="durationInput" 
                class="text-input text-right" 
                value="10" 
                min="1" 
                max="40" 
                step="1" 
                aria-label="Investment Duration in Years"
              >
              <span class="input-affix suffix">Yr</span>
            </div>
          </div>
          <div class="slider-wrapper">
            <input 
              type="range" 
              id="durationSlider" 
              class="range-slider" 
              value="10" 
              min="1" 
              max="40" 
              step="1"
              aria-label="Investment Duration Slider"
            >
          </div>
          <div class="presets-row">
            <button type="button" class="preset-chip" data-target="duration" data-value="5">5 Yrs</button>
            <button type="button" class="preset-chip active" data-target="duration" data-value="10">10 Yrs</button>
            <button type="button" class="preset-chip" data-target="duration" data-value="15">15 Yrs</button>
            <button type="button" class="preset-chip" data-target="duration" data-value="20">20 Yrs</button>
            <button type="button" class="preset-chip" data-target="duration" data-value="25">25 Yrs</button>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
